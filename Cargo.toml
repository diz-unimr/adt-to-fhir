[package]
name = "adt-to-fhir"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["fhir-core", "processor-hl7v2", "adt-config", "processor-csv"]

[dependencies]
rdkafka = { version = "0.38.0", features = ["ssl", "cmake-build"] }
tokio = { version = "1.50.2", features = ["full"] }
log = "0.4.34"
env_logger = "0.11.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3.34"
#serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
fhir-model = { version = "0.12.1", default-features = false, features = ["builders", "r4b"] }
hl7-parser = "0.3.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
chrono = { version = "0.4.45", features = ["serde"] }
#chrono-tz = "0.10"
#regex = "1.12"
tokio-util = "0.7.19"
opentelemetry = "0.33.0"
opentelemetry_sdk = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", features = ["grpc-tonic"] }
itertools = "0.15.0"
#uuid = { version = "1", features = ["v4"] }
fhir-core = { path = "fhir-core" }
processor-hl7v2 = { path = "processor-hl7v2" }
adt-config = { path = "adt-config" }
config = "0.15.27"
rstest = "0.27.0"
#processor-csv = { path = "processor-csv" }

[dev-dependencies]
mock-collector = "0.2.14"
adt-config = { path = "adt-config", features = ["test-utils"] }
insta = { version = "1.49.0", features = ["json", "redactions"] }
