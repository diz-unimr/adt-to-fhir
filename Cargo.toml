[package]
name = "adt-to-fhir"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["fhir-core", "processor-hl7v2", "adt-config", "processor-csv"]

[dependencies]
rdkafka = { version = "0.38", features = ["ssl", "cmake-build"] }
tokio = { version = "1.50", features = ["full"] }
log = "0.4"
env_logger = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
#serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fhir-model = { version = "0.12", default-features = false, features = ["builders", "r4b"] }
hl7-parser = "0.3"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
#regex = "1.12"
tokio-util = "0.7"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
itertools = "0.15"
#uuid = { version = "1", features = ["v4"] }
fhir-core = { path = "fhir-core" }
processor-hl7v2 = { path = "processor-hl7v2" }
adt-config = { path = "adt-config" }
#config = "0.15"
rstest = "0.26.1"
#processor-csv = { path = "processor-csv" }

[dev-dependencies]
mock-collector = "0.2"
adt-config = { path = "adt-config", features = ["test-utils"] }
insta = { version = "1", features = ["json", "redactions"] }
