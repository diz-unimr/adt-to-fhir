[package]
name = "adt-config"
version = "0.1.0"
edition = "2024"

[features]
test-utils = []

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
validator = { version = "0.20", features = ["derive"] }
config = "0.15"
anyhow = "1.0"
fhir-model = { version = "0.12", default-features = false, features = ["builders", "r4b"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
reqwest = { version = "0.13", features = ["blocking", "json"] }

[dev-dependencies]
